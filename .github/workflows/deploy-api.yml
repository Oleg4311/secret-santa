name: Deploy API
on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/draw.ts', 'scripts/build-worker.mjs', 'scripts/smoke-api.mjs', '.github/workflows/deploy-api.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-api
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test test/online-logic.test.ts test/online-http.test.ts
      - name: Субдомен workers.dev (создаётся один раз)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          cur=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result?.subdomain??''))")
          if [ -z "$cur" ]; then
            curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{"subdomain":"oleg4311"}' "$api" >/dev/null
            cur=oleg4311
          fi
          echo "API_HOST=secret-santa-api.$cur.workers.dev" >> "$GITHUB_ENV"
      - run: npm run build:worker
      - run: npx wrangler deploy --config worker/wrangler.jsonc
      - name: Проверка работающего API
        run: |
          for i in 1 2 3 4 5 6; do node scripts/smoke-api.mjs "https://$API_HOST" https://oleg4311.github.io && exit 0; sleep 10; done
          exit 1
